steps:
  - name: "gcr.io/cloud-builders/docker"
    id: "build-spp-portal"
    args:
      - "build"
      - "-f"
      - "Dockerfile"
      - "-t"
      - "${_REGISTRY}/spp-portal:${_TAG}"
      - "-t"
      - "${_REGISTRY}/spp-portal:latest"
      - "."

images:
  - "${_REGISTRY}/spp-portal:${_TAG}"
  - "${_REGISTRY}/spp-portal:latest"

substitutions:
  _REGISTRY: "us-east1-docker.pkg.dev/microdrive-dev/spp"
  _TAG: "v1.0.0"

options:
  logging: CLOUD_LOGGING_ONLY
