server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Use kube-dns resolver and variable target so nginx starts cleanly even when ssp-cp is not deployed yet
    resolver 169.254.20.10 10.96.0.10 valid=10s ipv6=off;

    location /api/ {
        set $ssp_cp_upstream "http://ssp-cp.spp-platform.svc.cluster.local:8000";
        proxy_pass $ssp_cp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files /config.js =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
