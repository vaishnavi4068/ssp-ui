---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spp-portal-runtime-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: spp-portal
    app.kubernetes.io/part-of: spp-portal
data:
  config.js: |
    window.__SPP_CONFIG__ = {
      API_BASE_URL: {{ .Values.runtimeConfig.apiUrl | quote }},
      DEFAULT_CMEK_KEY_TEMPLATE: {{ .Values.runtimeConfig.defaultCmekKeyTemplate | quote }},
      MICRODRIVE_CMEK_KEY: {{ .Values.runtimeConfig.microdriveCmekKey | quote }}
    };
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spp-portal
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: spp-portal
    app.kubernetes.io/part-of: spp-portal
spec:
  replicas: {{ .Values.replicas.portal }}
  selector:
    matchLabels:
      app.kubernetes.io/name: spp-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spp-portal
        app.kubernetes.io/part-of: spp-portal
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.global.tolerations | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: spp-portal
          image: "{{ .Values.images.registry }}/{{ .Values.images.repo }}:{{ .Values.images.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: SPP_API_URL
              value: {{ .Values.runtimeConfig.apiUrl | quote }}
            - name: SPP_DEFAULT_CMEK_KEY_TEMPLATE
              value: {{ .Values.runtimeConfig.defaultCmekKeyTemplate | quote }}
            - name: SPP_MICRODRIVE_CMEK_KEY
              value: {{ .Values.runtimeConfig.microdriveCmekKey | quote }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: spp-portal
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: spp-portal
    app.kubernetes.io/part-of: spp-portal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spp-portal
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- if .Values.loadBalancer.internalServiceEnabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: spp-portal-internal-lb
  namespace: {{ .Values.global.namespace }}
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: spp-portal
  ports:
    - name: http
      port: 80
      targetPort: 8080
  loadBalancerSourceRanges:
    {{- toYaml .Values.loadBalancer.corporateCidrRanges | nindent 4 }}
{{- end }}
{{- if .Values.loadBalancer.internalIngressEnabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spp-portal-internal
  namespace: {{ .Values.global.namespace }}
  annotations:
    kubernetes.io/ingress.class: "gce-internal"
spec:
  rules:
    - http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: spp-portal-internal-lb
                port:
                  number: 80
{{- end }}
